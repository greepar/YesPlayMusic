name: Release

on:
  # 只在打 v* 标签时构建并发布 GitHub Release
  push:
    tags:
      - v*
  # 手动触发只构建、不发布（发布前试跑用）
  workflow_dispatch:

env:
  YARN_INSTALL_NOPT: yarn add --ignore-engines --ignore-platform --ignore-optional
  VUE_APP_NETEASE_API_URL: /api
  VUE_APP_ELECTRON_API_URL: /api
  VUE_APP_ELECTRON_API_URL_DEV: http://127.0.0.1:10754
  VUE_APP_LASTFM_API_KEY: 09c55292403d961aa517ff7f5e8a3d9c
  VUE_APP_LASTFM_API_SHARED_SECRET: 307c9fda32b3904e53654baff215cb67

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-arm64
            os: macos-15
            args: -m --arm64
          - name: mac-x64
            os: macos-15-intel
            args: -m --x64
          - name: win
            os: windows-latest
            args: -w
          - name: linux
            os: ubuntu-22.04
            args: -l

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install icon tools (on Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update &&
          sudo apt-get install --no-install-recommends -y libopenjp2-tools

      - id: get_unm_version
        name: Get the installed UNM version
        run: |
          yarn --ignore-engines --ignore-optional
          unm_version=$(node -e "console.log(require('./node_modules/@unblockneteasemusic/rust-napi/package.json').version)")
          echo "unmver=${unm_version}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Install UNM dependencies for Windows
        if: runner.os == 'Windows'
        run: |
          ${{ env.YARN_INSTALL_NOPT }} \
            @unblockneteasemusic/rust-napi-win32-x64-msvc@${{steps.get_unm_version.outputs.unmver}}
        shell: bash

      - name: Install UNM dependencies for macOS
        if: runner.os == 'macOS'
        run: |
          ${{ env.YARN_INSTALL_NOPT }} \
            @unblockneteasemusic/rust-napi-darwin-x64@${{steps.get_unm_version.outputs.unmver}} \
            @unblockneteasemusic/rust-napi-darwin-arm64@${{steps.get_unm_version.outputs.unmver}} \
            dmg-license
        shell: bash

      - name: Install UNM dependencies for Linux
        if: runner.os == 'Linux'
        run: |
          ${{ env.YARN_INSTALL_NOPT }} \
            @unblockneteasemusic/rust-napi-linux-x64-gnu@${{steps.get_unm_version.outputs.unmver}} \
            @unblockneteasemusic/rust-napi-linux-arm64-gnu@${{steps.get_unm_version.outputs.unmver}} \
            @unblockneteasemusic/rust-napi-linux-arm-gnueabihf@${{steps.get_unm_version.outputs.unmver}}
        shell: bash

      # Windows 用 PowerShell 构建：Git Bash 会把环境变量里形如 /api 的值改写成
      # C:/Program Files/Git/api，导致打进包里的接口地址错误。
      # 不在这里发布，由下面的 release job 统一上传，避免多个 job 同时写同一个 Release。
      # 注意：不要写 `CSC_LINK: ${{ secrets.CSC_LINK }}`——Secret 未配置时它会变成
      # 空字符串，electron-builder 会把它当作证书路径而报错。
      # macOS 使用 ad-hoc 签名（见 vue.config.js），避免 Gatekeeper 提示「已损坏」。
      - name: Build Electron app (Windows)
        if: runner.os == 'Windows'
        run: yarn electron:build ${{ matrix.args }}
        shell: pwsh

      - name: Build Electron app
        if: runner.os != 'Windows'
        run: yarn electron:build ${{ matrix.args }}
        shell: bash

      - name: Verify bundled API base URL
        # 防止环境变量被 shell 改写（如 Git Bash 的 /api -> C:/Program Files/Git/api）后仍然发布
        run: |
          if grep -rIl "Program Files/Git" dist_electron/bundled/js 2>/dev/null; then
            echo "::error::bundled JS contains a rewritten path (Program Files/Git)"; exit 1
          fi
          grep -rIlE '"/api"|VUE_APP_ELECTRON_API_URL' dist_electron/bundled/js > /dev/null || { echo "::error::API base URL not found in bundle"; exit 1; }
          echo "API base URL looks sane"
        shell: bash

      - name: Verify macOS code signature
        if: runner.os == 'macOS'
        run: |
          app=$(ls -d dist_electron/mac*/YesPlayMusic.app | head -n 1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E "Signature|Authority|flags" || true

      - uses: actions/upload-artifact@v4
        with:
          name: YesPlayMusic-${{ matrix.name }}
          path: |
            dist_electron/*.dmg
            dist_electron/*.exe
            dist_electron/*.AppImage
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    # 某个平台失败时，其余平台的产物仍然发布
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: YesPlayMusic-*
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          # 所有平台都构建失败时不要创建空的 Release
          fail_on_unmatched_files: true
          draft: false
          generate_release_notes: true
          body: |
            ### macOS 安装说明
            - Apple 芯片（M 系列）下载 `arm64`，Intel 芯片下载 `x64`
            - 应用使用 ad-hoc 签名（未经 Apple 公证）。首次打开如果被拦截：
              - 在「系统设置 → 隐私与安全性」中点击「仍要打开」，或
              - 终端执行：`xattr -cr /Applications/YesPlayMusic.app`
